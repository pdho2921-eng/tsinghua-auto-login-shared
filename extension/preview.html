<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>错误提示预览 · 清华网站自动重登</title>
  <link rel="icon" href="icons/icon-32.png"><link rel="stylesheet" href="options.css"><link rel="stylesheet" href="preview.css">
</head>
<body>
<main class="preview-shell">
  <p class="eyebrow">清华网站自动重登 · 界面预览</p>
  <h1>错误提示预览</h1>
  <p class="intro">选择一种情况，查看右下角的提示。这里不会登录学校网站，也不会读取账号密码。</p>
  <section class="card preview-controls" aria-label="选择预览内容">
    <label for="scenario">提示情况</label>
    <select id="scenario"></select>
    <div class="actions"><button id="show-again" class="button secondary" type="button">重新显示</button></div>
    <p class="description preview-help">可以检查提示的大小、颜色和文字。点击“关闭提示”后，可用“重新显示”恢复。</p>
    <p id="preview-status" class="feedback" role="status"></p>
  </section>
</main>
<script src="platform.js"></script><script src="native.js"></script><script src="notice.js"></script><script src="preview.js"></script>
</body>
</html>
